name: Ubuntu

on:
  push:
    branches:
      - main
      - python-decoupling
      - decoupled-interval
  pull_request:

env:
  SCCACHE_GHA_ENABLED: "true"

jobs:
  build-test:
    name: ${{ matrix.config.name }} [${{ matrix.build_type }}]
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]
        config:
          - { name: "Ubuntu 24.04 x86 Clang 16", os: ubuntu-24.04, cxx: "clang++-16", pkg: "clang-16" }
          - { name: "Ubuntu 24.04 arm Clang 16", os: ubuntu-24.04-arm, cxx: "clang++-16", pkg: "clang-16" }
          - { name: "Ubuntu 24.04 x86 GCC 13", os: ubuntu-24.04, cxx: "g++-13", pkg: "g++-13", libstdcxx_debug: true }
          - { name: "Ubuntu 24.04 arm GCC 13", os: ubuntu-24.04-arm, cxx: "g++-13", pkg: "g++-13", libstdcxx_debug: true }

    steps:
      - uses: actions/checkout@v7

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.18.0"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Python test dependencies
        if: matrix.build_type == 'Debug'
        run: python -m pip install pytest

      - name: Get Linux concurrency
        if: runner.os == 'Linux'
        run: echo "NPROC=$(nproc)" >> "$GITHUB_ENV"

      - name: Set up Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config ${{ matrix.config.pkg }}

      - name: Configure CMake
        env:
          CXXFLAGS: ${{ matrix.build_type == 'Debug' && matrix.config.libstdcxx_debug && '-D_GLIBCXX_DEBUG' || '' }}
        run: |
          cmake -S . -B "${{ runner.workspace }}/build" -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.config.cxx }} \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -DPYTHON_ENFORCE_TESTS=${{ matrix.build_type == 'Debug' && 'ON' || 'OFF' }} \
            -DWARNINGS_AS_ERRORS=ON

      - name: Build Release library and bindings
        if: matrix.build_type == 'Release'
        run: cmake --build "${{ runner.workspace }}/build" --parallel "$NPROC" --target ariadne-numeric bindings

      - name: Install Release library
        if: matrix.build_type == 'Release'
        run: cmake --install "${{ runner.workspace }}/build" --prefix "${{ runner.workspace }}/install"

      - name: Prepare C++ numeric tutorial
        if: matrix.build_type == 'Release'
        run: cmake -E copy_directory "$GITHUB_WORKSPACE/tutorials/tutorial_numeric" "${{ runner.workspace }}/tutorial_numeric"

      - name: Build and check C++ numeric tutorial
        if: matrix.build_type == 'Release'
        working-directory: ${{ runner.workspace }}/tutorial_numeric
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_PREFIX_PATH="${{ runner.workspace }}/install" \
            -DCMAKE_CXX_COMPILER=${{ matrix.config.cxx }} \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          cmake --build build --parallel "$NPROC"
          export LD_LIBRARY_PATH="${{ runner.workspace }}/install/lib:${LD_LIBRARY_PATH:-}"
          export DYLD_LIBRARY_PATH="${{ runner.workspace }}/install/lib:${DYLD_LIBRARY_PATH:-}"
          ./build/tutorial_numeric


      - name: Check Python numeric tutorial
        if: matrix.build_type == 'Release'
        working-directory: ${{ github.workspace }}/python/tutorials
        env:
          PYTHONPATH: ${{ runner.workspace }}/build/python
        run: python tutorial_numeric.py

      - name: Verify uninstallation
        if: matrix.build_type == 'Release'
        run: cmake --build "${{ runner.workspace }}/build" --target uninstall

      - name: Build Debug tests and bindings
        if: matrix.build_type == 'Debug'
        run: cmake --build "${{ runner.workspace }}/build" --parallel "$NPROC" --target tests

      - name: Run Debug C++ tests
        if: matrix.build_type == 'Debug'
        run: ctest --test-dir "${{ runner.workspace }}/build" -j "$NPROC" -LE python --output-on-failure

      - name: Run Debug Python tests
        if: matrix.build_type == 'Debug'
        run: ctest --test-dir "${{ runner.workspace }}/build" -L python --output-on-failure
