name: Windows

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: Windows 2025 [Release]
    runs-on: windows-2025

    env:
      VCPKG_BINARY_SOURCES: "clear;files,${{ runner.workspace }}/vcpkg-cache,readwrite"

    steps:
    - uses: actions/checkout@v3
      with:
        submodules: recursive

    - name: Get vcpkg revision
      shell: pwsh
      run: |
        $rev = git -C C:/vcpkg rev-parse HEAD
        "VCPKG_REV=$rev" | Out-File -FilePath $env:GITHUB_ENV -Append

    - name: Cache vcpkg binaries
      uses: actions/cache@v4
      with:
        path: ${{ runner.workspace }}/vcpkg-cache
        key: vcpkg-windows-release-${{ env.VCPKG_REV }}-${{ hashFiles('cmake/triplets/x64-windows-release.cmake') }}
        restore-keys: |
          vcpkg-windows-release-${{ env.VCPKG_REV }}-

    - name: Install GMP and MPFR with vcpkg
      shell: pwsh
      run: |
        & C:/vcpkg/vcpkg.exe install gmp:x64-windows-release mpfr:x64-windows-release --overlay-triplets="$env:GITHUB_WORKSPACE/cmake/triplets"

    - name: Create Build Environment
      run: cmake -E make_directory ${{ runner.workspace }}/build

    - name: Configure CMake
      working-directory: ${{ runner.workspace }}/build
      run: cmake $env:GITHUB_WORKSPACE -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=x64-windows-release -DVCPKG_OVERLAY_TRIPLETS=$env:GITHUB_WORKSPACE/cmake/triplets -DWARNINGS_AS_ERRORS=ON

    - name: Build
      working-directory: ${{ runner.workspace }}/build
      run: cmake --build . --parallel --config Release

    - name: Test
      working-directory: ${{ runner.workspace }}/build
      run: ctest -C Release --output-on-failure
