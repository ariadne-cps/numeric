name: Windows

on:
  push:
    branches:
      - main
      - python-decoupling
      - decoupled-interval
  pull_request:

env:
  SCCACHE_GHA_ENABLED: "true"

jobs:
  build-test:
    name: Windows 2025 MSVC [${{ matrix.build_type == 'Release' && 'Release Build' || 'Debug Tests' }}]
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]

    steps:
      - uses: actions/checkout@v3

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.18.0"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python test dependencies
        if: matrix.build_type == 'Debug'
        run: python -m pip install pytest

      - name: Configure CMake
        run: |
          # /Z7 avoids concurrent compiler PDB writes in Debug.
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} `
            -DCMAKE_C_COMPILER_LAUNCHER=sccache `
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache `
            -DCMAKE_CXX_FLAGS_DEBUG="/Z7 /Ob0 /Od /RTC1" `
            -DPYTHON_ENFORCE_TESTS=${{ matrix.build_type == 'Debug' && 'ON' || 'OFF' }} `
            -DWARNINGS_AS_ERRORS=ON

      - name: Build Release library and bindings
        if: matrix.build_type == 'Release'
        run: cmake --build build --parallel --target ariadne-numeric bindings

      - name: Install Release library
        if: matrix.build_type == 'Release'
        run: cmake --install build --prefix "${{ runner.workspace }}/install"

      - name: Prepare C++ numeric tutorial
        if: matrix.build_type == 'Release'
        shell: pwsh
        run: cmake -E copy_directory "$env:GITHUB_WORKSPACE/tutorials/tutorial_numeric" "${{ runner.workspace }}/tutorial_numeric"

      - name: Build and check C++ numeric tutorial
        if: matrix.build_type == 'Release'
        shell: pwsh
        working-directory: ${{ runner.workspace }}/tutorial_numeric
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="${{ runner.workspace }}/install" -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          cmake --build build --parallel
          $env:PATH = "${{ runner.workspace }}\install\bin;$env:PATH"
          & ".\build\tutorial_numeric.exe"

      - name: Check Python numeric tutorial
        if: matrix.build_type == 'Release'
        shell: pwsh
        working-directory: ${{ github.workspace }}/python/tutorials
        run: python tutorial_numeric.py

      - name: Verify uninstallation
        if: matrix.build_type == 'Release'
        run: cmake --build build --target uninstall

      - name: Build Debug tests and bindings
        if: matrix.build_type == 'Debug'
        run: cmake --build build --parallel --target tests

      - name: Trace BigUnsigned Debug test
        if: matrix.build_type == 'Debug'
        continue-on-error: true
        run: ctest --test-dir build -R "^test_big_unsigned$" -V --timeout 60 --output-on-failure

      - name: Run Debug C++ tests
        if: matrix.build_type == 'Debug'
        run: ctest --test-dir build -j $env:NUMBER_OF_PROCESSORS -LE python --output-on-failure

      - name: Run Debug Python tests
        if: matrix.build_type == 'Debug'
        run: ctest --test-dir build -L python --output-on-failure
