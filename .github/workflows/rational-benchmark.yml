name: Rational benchmark

on:
  push:
    branches: [remove-gmp]
    paths:
      - 'src/big_unsigned.cpp'
      - 'src/rational.cpp'
      - 'include/numeric/big_unsigned.hpp'
      - '.github/workflows/rational-benchmark.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    name: x86-64 ${{ matrix.compiler }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++-13, clang++-16]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          submodules: recursive
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++-13 clang-16 libgmp-dev libmpfr-dev
      - name: Prepare baseline
        run: |
          git worktree add --detach ../numeric-before HEAD^
          git -C ../numeric-before submodule update --init --recursive
      - name: Build both revisions
        env:
          CXX: ${{ matrix.compiler }}
        run: |
          cmake -S ../numeric-before -B build-before -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_PYTHON_BINDINGS=OFF -DWARNINGS_AS_ERRORS=ON
          cmake --build build-before --parallel 2 --target benchmark_compare_rational_backends
          cmake -S . -B build-after -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_PYTHON_BINDINGS=OFF -DWARNINGS_AS_ERRORS=ON
          cmake --build build-after --parallel 2 --target benchmark_compare_rational_backends test_big_unsigned test_integer test_rational test_float test_float_rounding
      - name: Test candidate
        run: ctest --test-dir build-after -R '^test_(big_unsigned|integer|rational|float|float_rounding)$' --output-on-failure
      - name: Measure sequentially on the same runner
        shell: bash
        run: |
          mkdir results
          {
            uname -a
            lscpu
            ${{ matrix.compiler }} --version
            git rev-parse HEAD^ HEAD
          } > results/host.txt
          for revision in before after; do
            ./build-$revision/benchmarks/benchmark_compare_rational_backends --bits 53,128,256,1024,2048,4096 --iterations 20000 --samples 31 > results/$revision.txt 2>&1
            cat results/$revision.txt
            {
              echo "### $revision (${{ matrix.compiler }})"
              echo '```text'
              sed -n '/Rational \/ GMP slowdown/,$p' results/$revision.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rational-x86-64-${{ matrix.compiler }}
          path: results/
