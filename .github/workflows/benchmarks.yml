name: Benchmark smoke tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  benchmarks:
    name: Benchmarking integration (Ubuntu / GCC)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++

      - name: Configure standalone Release build
        run: |
          cmake -S . -B build-benchmarks -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_PYTHON_BINDINGS=OFF \
            -DWARNINGS_AS_ERRORS=ON

      - name: Build all dedicated benchmarks
        run: cmake --build build-benchmarks --parallel 2 --target benchmarks

      - name: Verify Dyadic samples, summary selection and warm-ups
        run: |
          ./build-benchmarks/benchmarks/benchmark_dyadic \
            --bits 53 --iterations 8 --samples 3 --warmups 1 \
            --summary min,median,count

      - name: Verify FloatMP measurement and report
        run: |
          ./build-benchmarks/benchmarks/benchmark_floatmp \
            --bits 53 --iterations 8 --samples 3 --warmups 1 \
            --summary min,median,count

      - name: Verify typed FloatDP/FloatMP pairing and aggregation
        run: |
          ./build-benchmarks/benchmarks/benchmark_compare_double_precision_backends \
            --bits 53 --iterations 8 --samples 3 --warmups 1 \
            --summary min,median,count --details

      - name: Verify standalone BigUnsigned arithmetic and invariants
        run: |
          ./build-benchmarks/benchmarks/benchmark_big_unsigned \
            --bits 53 --iterations 8 --samples 3 --warmups 1 \
            --summary min,median,count

      - name: Verify standalone Rational arithmetic and invariants
        run: |
          ./build-benchmarks/benchmarks/benchmark_rational \
            --bits 53 --iterations 8 --samples 3 --warmups 1 \
            --summary min,median,count
